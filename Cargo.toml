[workspace]
resolver = "3"
members = [
    "crates/fhir-definitions",
    "crates/fhir-parser",
    "crates/fhir-fhirpath",
    "crates/fhir-validator",
    "crates/fhir-linter",
    "crates/fhir-cli",
    "bindings/python",
    "bindings/typescript",
]

[workspace.package]
version      = "1.2.0"
edition      = "2024"
authors      = ["fhir-linter contributors"]
license      = "MIT"
repository   = "https://github.com/example/fhir-linter"
rust-version = "1.85"

[workspace.dependencies]
# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# XML parsing
quick-xml   = "0.41"

# FHIRPath parser
pest        = "2"
pest_derive = "2"

# Regex
regex-lite  = "0.1"

# Collections
indexmap    = { version = "2", features = ["serde"] }

# Diagnostics
thiserror   = "2"

# CLI
clap        = { version = "4", features = ["derive", "env"] }

# Bindings
pyo3         = { version = "0.30", features = ["abi3-py310"] }
napi         = { version = "3", default-features = false, features = ["napi4", "async"] }
napi-derive  = "3"
napi-build   = "2"

# Internal crates
fhir-definitions = { path = "crates/fhir-definitions" }
fhir-parser      = { path = "crates/fhir-parser" }
fhir-fhirpath    = { path = "crates/fhir-fhirpath" }
fhir-validator   = { path = "crates/fhir-validator" }
fhir-linter      = { path = "crates/fhir-linter" }
